<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Coding Web</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <div>
          <h1>AI Coding</h1>
          <p class="meta">Multi-turn workspace agent</p>
        </div>
        <button id="refresh" type="button">Refresh</button>
      </div>

      <button id="new-session" class="primary full-width" type="button">New chat</button>
      <div id="sessions" class="session-list"></div>
    </aside>

    <main class="chat-shell">
      <section class="topbar">
        <div class="field-grid">
          <label>
            Workspace
            <input id="run-workspace" value="runtime/web_run_workspace" />
          </label>
          <label>
            Session
            <input id="run-session" placeholder="auto-generated" />
          </label>
          <label>
            Mode
            <select id="run-mode">
              <option value="agent" selected>agent</option>
              <option value="ask">ask</option>
              <option value="plan">plan</option>
              <option value="edit">edit</option>
            </select>
          </label>
        </div>
      </section>

      <section id="messages" class="messages" aria-live="polite">
        <div class="empty-state">
          <h2>Start a coding conversation</h2>
          <p>Send a request, then keep using the same session for follow-up changes.</p>
        </div>
      </section>

      <section class="composer">
        <textarea id="run-task" rows="4" placeholder="Describe the next coding task"></textarea>
        <div class="composer-actions">
          <span id="run-status" class="meta"></span>
          <button id="run-agent" class="primary" type="button">Send</button>
        </div>
      </section>
    </main>

    <aside class="inspector">
      <section class="summary" id="summary">
        <h2>Session activity</h2>
        <p class="meta">Trace details appear after a run or after selecting a session.</p>
      </section>

      <section class="filters" aria-label="event filters">
        <label><input type="checkbox" value="model_call" checked /> model</label>
        <label><input type="checkbox" value="tool_call" checked /> tools</label>
        <label><input type="checkbox" value="final_response" checked /> final</label>
        <label><input type="checkbox" value="model_fallback" checked /> fallback</label>
        <label><input type="checkbox" value="state_transition" checked /> state</label>
      </section>

      <section class="trace-panel">
        <div class="timeline" id="timeline"></div>
        <article class="detail" id="detail">
          <h2>Event detail</h2>
          <p class="meta">Select an event from the timeline.</p>
        </article>
      </section>
    </aside>

    <script src="/app.js"></script>
  </body>
</html>
